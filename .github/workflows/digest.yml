name: Digest

on:
  schedule:
    # 06:00 UTC, Monday to Friday.
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

# Read-only: the seen-job database lives in the Actions cache, not in git.
permissions:
  contents: read

# Two runs writing the database at once would lose one side's history.
concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    name: Send digest
    runs-on: ubuntu-latest

    steps:
      # First, so a misconfigured run fails in seconds and names everything
      # missing at once rather than stopping at the first gap.
      - name: Check required secrets
        env:
          PREFS_YAML: ${{ secrets.PREFS_YAML }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          missing=""
          for name in PREFS_YAML SMTP_HOST EMAIL_FROM EMAIL_TO; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Digest not configured. Missing repository secret(s):$missing"
            echo "Set them under Settings → Secrets and variables → Actions, or with:" >&2
            for name in $missing; do
              if [ "$name" = "PREFS_YAML" ]; then
                echo "  gh secret set PREFS_YAML < prefs.yaml" >&2
              else
                echo "  gh secret set $name" >&2
              fi
            done
            echo "See the README (GitHub Actions) for the full list." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Alert history is state, not source. Keeping it in the cache keeps it
      # out of the public repo and stops git history growing a binary a day.
      # A cache miss (eviction after 7 idle days) costs one repeated digest,
      # never a wrong one.
      - name: Restore the seen-job database
        id: seen-cache
        uses: actions/cache/restore@v4
        with:
          path: data/seen_jobs.db
          key: seen-jobs-${{ github.run_id }}
          restore-keys: |
            seen-jobs-

      - name: Write prefs.yaml from the PREFS_YAML secret
        env:
          PREFS_YAML: ${{ secrets.PREFS_YAML }}
        run: printf '%s\n' "$PREFS_YAML" > prefs.yaml

      - name: Run the digest
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_STARTTLS: ${{ secrets.SMTP_STARTTLS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_API_KEY: ${{ secrets.ADZUNA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # The digest is emailed either way; the flag turns a broken source into
        # a red run so silent loss of coverage is noticed.
        run: python -m opportunities_abroad --send --prefs prefs.yaml --fail-on-source-error

      # Always saved, even if the digest step failed, so a partial run does not
      # re-alert everything it already emailed.
      - name: Persist the seen-job database
        if: always() && hashFiles('data/seen_jobs.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data/seen_jobs.db
          key: seen-jobs-${{ github.run_id }}
