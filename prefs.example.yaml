# Sample preferences for an Indian software engineer targeting the
# Netherlands / EU, plus remote-friendly international roles.
#
# Copy to prefs.yaml and edit. prefs.yaml is gitignored.

include_keywords:
  - python
  - software engineer
  - software developer
  - backend
  - back-end
  - fullstack
  - full-stack
  - full stack
  - django
  - fastapi
  - flask
  - devops
  - platform engineer
  - site reliability
  - sre
  - data engineer
  - machine learning
  - typescript
  - node.js
  - golang
  - rust

exclude_keywords:
  - intern
  - internship
  - unpaid
  - volunteer
  - "student only"
  - bootcamp

# Matched against the job title only, with the same word-boundary phrase rules
# as exclude_keywords ("intern" will not hit "international").
title_exclude:
  - junior
  - jr
  - graduate
  - trainee
  - apprentice
  - intern
  - internship
  - working student
  - werkstudent
  - stage
  - stagiair

# Leave empty to accept any title that passes the filters above.
title_include: []

# Drop postings older than this when the source reports a date. 0 disables.
max_age_days: 14

# Target onsite / hybrid geography (case-insensitive; aliases are expanded).
locations:
  countries:
    - Netherlands
    - Germany
    - Belgium
    - Austria
    - Ireland
    - France
    - Spain
    - Portugal
    - Sweden
    - Denmark
    - Finland
    - Norway
    - Poland
    - Czech Republic
    - Switzerland
    - Luxembourg
    - Estonia
    - EU
    - Europe
  cities:
    - Amsterdam
    - Rotterdam
    - Utrecht
    - Eindhoven
    - The Hague
    - Berlin
    - Munich
    - Hamburg
    - Dublin
    - Lisbon
    - Barcelona

work_mode:
  remote: true          # include remote / remote-friendly roles
  hybrid: true
  onsite: true          # include onsite roles in the countries/cities above
  remote_only: false    # set true to drop onsite-only postings

# If a remote job names a required candidate location, accept these
# and reject clearly US/UK-only (or similar) restrictions unless those
# countries are in `locations.countries`.
remote:
  accept_locations:
    - Worldwide
    - Anywhere
    - Remote
    - Global
    - International
    - Europe
    - EU
    - EEA
    - EMEA
    - India
    - APAC
  reject_locations:
    - USA only
    - US only
    - United States only
    - North America only
    - Canada only
    - UK only
    - United Kingdom only

# Visa sponsorship handling.
#   require:    drop jobs unless the source flags sponsorship or a visa_keyword hits
#   classifier: ask Claude to read each matched posting and judge sponsorship.
#               Needs ANTHROPIC_API_KEY. Verdicts are cached per job, so a rerun
#               costs nothing. Any API failure is recorded as "unclear".
visa:
  require: false
  classifier: false
  classifier_model: claude-sonnet-4-6

# Soft boost in ranking (not a hard filter). Helpful when relocating from India.
visa_keywords:
  - visa
  - sponsorship
  - relocation
  - relocate
  - work permit
  - blue card
  - highly skilled migrant
  - kennismigrant
  - immigration

# Ranking knobs. Every listed keyword that hits adds its weight, so a title
# packed with your keywords outranks one that mentions them in passing.
score_weights:
  title_hit: 8      # per include_keyword found in the title
  keyword_hit: 3    # per include_keyword found anywhere
  remote: 4         # flat bonus for a remote role
  visa_hit: 5       # per visa_keyword found anywhere

# Country or city -> bonus, matched against the job's location. Country names
# expand through the built-in aliases (Netherlands also covers NL, Amsterdam,
# Rotterdam, ...). Only the single best match applies; city weights do not
# stack on top of their country.
location_weights:
  Netherlands: 6
  Germany: 3
  Europe: 3

digest:
  max_jobs: 25
  # Write the rendered HTML digest here on every run, including dry-run.
  # save_html_to: data/digest.html

sources:
  remotive: true
  arbeitnow: true
  adzuna: true   # live calls only if ADZUNA_APP_ID and ADZUNA_API_KEY are set
  greenhouse: true
  lever: true
  ashby: true

# Company job boards published by applicant-tracking systems. All three are
# public, key-free JSON endpoints; a board is only fetched if it is listed here.
# A slug is the company segment of the public board URL, e.g.
#   https://boards.greenhouse.io/SLUG  https://jobs.lever.co/SLUG  https://jobs.ashbyhq.com/SLUG
# These seeds are NL/EU companies as a starting point — open each board URL to
# confirm the slug. An unknown slug is logged and skipped, never fatal.
ats_boards:
  greenhouse:
    - adyen
    - mollie
    - elastic
    - databricks
  lever:
    - wetransfer
    - tiqets
    - plaid
  ashby:
    - framer
    - linear
    - ramp

# Used only when the Adzuna source is enabled and keys are present.
adzuna:
  countries: [nl, de, at, be, fr, ie]
  what: software engineer python
  results_per_page: 20
  max_pages: 1

arbeitnow:
  max_pages: 2          # API is rate-limited; keep this small
  visa_sponsorship: null  # true / false / null (no filter)

http:
  timeout_seconds: 30
