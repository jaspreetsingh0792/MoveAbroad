[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moveabroad"
version = "0.1.0"
description = "Personalized job alerts for people who want to work abroad."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Jaspreet Singh" }]
keywords = ["jobs", "alerts", "relocation", "international", "europe", "netherlands", "india"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
]
dependencies = [
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/jaspreetsingh0792/opportunities-abroad"
Issues = "https://github.com/jaspreetsingh0792/opportunities-abroad/issues"

[project.scripts]
moveabroad = "opportunities_abroad.cli:main"
opportunities-abroad = "opportunities_abroad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "B",
  "UP",
  "C4",
]
ignore = ["UP017"]

[tool.ruff.lint.isort]
known-first-party = ["opportunities_abroad"]
known-local-folder = ["tests"]
